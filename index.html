<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>链接·梦角 · 专属占卜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #fef0f0 0%, #fce4ec 50%, #fde8ef 100%);
            padding: 20px 16px 40px;
            color: #5e5a55;
            transition: background 0.6s, color 0.6s;
        }
        /* 深色背景模式 */
        body.dark-mode {
            color: #f0e0e0 !important;
        }
        body.dark-mode .header h1 { color: #f5d6dc; }
        body.dark-mode .header p { color: #ddc0c7; }
        body.dark-mode .setup-card,
        body.dark-mode .result-header,
        body.dark-mode .result-cards,
        body.dark-mode .final-guide {
            background: rgba(30, 20, 25, 0.75);
            backdrop-filter: blur(10px);
            border-color: rgba(180, 130, 140, 0.3);
        }
        body.dark-mode .name-row input {
            color: #f0e0e0;
            border-bottom-color: #b5838d;
        }
        body.dark-mode .q-input {
            background: rgba(40, 30, 35, 0.6);
            color: #f0e0e0;
            border-color: #b5838d;
        }
        body.dark-mode .q-input::placeholder { color: #aa9099; }
        body.dark-mode .btn-primary {
            background: linear-gradient(135deg, #c97a88, #d4949f);
        }
        body.dark-mode .bg-setting label,
        body.dark-mode .bg-reset {
            color: #dbbcc4;
        }
        body.dark-mode .draw-hint { color: #dbbcc4; }
        body.dark-mode .deck-btn {
            background: #a0727b;
            color: #f0e0e0;
            border-color: #c08a94;
        }
        body.dark-mode .card-placeholder {
            background: #352a2d;
            border-color: #6f535b;
            color: #dbbcc4;
        }
        body.dark-mode .card-placeholder.flipped {
            background: #3f3236;
            border-color: #b5838d;
            color: #f0e0e0;
        }
        body.dark-mode .card-placeholder .card-name { color: #f5d6dc; }
        body.dark-mode .card-placeholder .rev-tag {
            background: #54383e;
            color: #eebbc5;
        }
        body.dark-mode .result-item .card-name { color: #f5d6dc; }
        body.dark-mode .result-item .desc { color: #ddd0d3; }
        body.dark-mode .final-guide .guide-title { color: #eebbc5; }
        body.dark-mode .final-guide .guide-body { color: #ddd0d3; }
        body.dark-mode .protection-block {
            background: rgba(210, 80, 90, 0.15);
            border-left-color: #d47484;
        }
        body.dark-mode .protection-block .protect-label { color: #f09aa8; }
        body.dark-mode .action-btn {
            background: rgba(70, 45, 50, 0.6);
            border-color: #b5838d;
            color: #f0e0e0;
        }
        body.dark-mode .action-btn:hover {
            background: rgba(120, 70, 80, 0.5);
        }

        .container { max-width: 780px; margin: 0 auto; }

        /* header */
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 2.2em; letter-spacing: 4px; color: #b5838d; font-weight: 300; }
        .header p { color: #c9a9b0; font-size: 0.85em; letter-spacing: 2px; }

        /* 设置区 */
        .setup-card {
            background: rgba(255, 251, 249, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 28px 20px 32px;
            box-shadow: 0 8px 30px rgba(181, 131, 141, 0.10);
            border: 1px solid rgba(255, 224, 225, 0.4);
            max-width: 510px;
            margin: 0 auto 30px;
        }
        .name-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .name-row input {
            border: none;
            border-bottom: 1.5px solid #f0d4d9;
            background: transparent;
            text-align: center;
            padding: 8px 4px;
            font-size: 1em;
            width: 102px;
            outline: none;
            color: #4a3f42;
            font-family: inherit;
        }
        .name-row input:focus { border-bottom-color: #b5838d; }
        .name-row span { color: #dcc8cc; font-size: 1.1em; }

        .q-input {
            width: 100%;
            padding: 14px 20px;
            border: 1.5px solid #f0dce0;
            border-radius: 46px;
            background: rgba(255, 253, 251, 0.8);
            font-size: 1em;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 24px;
            font-family: inherit;
        }
        .q-input:focus { border-color: #c9a9b0; }
        .q-input::placeholder { color: #d4bec3; }

        .btn-primary {
            display: block;
            width: 100%;
            max-width: 230px;
            margin: 0 auto;
            padding: 14px 20px;
            background: linear-gradient(135deg, #b5838d, #c9a9b0);
            color: #fff;
            border: none;
            border-radius: 46px;
            font-size: 1em;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(181, 131, 141, 0.20);
            transition: 0.3s;
            font-family: inherit;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-primary:active { transform: scale(0.96); }

        /* 背景设置 */
        .bg-setting {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #f0e2e5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .bg-setting label {
            font-size: 0.8em;
            color: #b99ca3;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .bg-setting input[type="file"] { display: none; }
        .bg-preview {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #f0dce0;
            object-fit: cover;
            background: #fef0f0;
            cursor: pointer;
        }
        .bg-reset {
            font-size: 0.75em;
            color: #b99ca3;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #f0dce0;
            background: rgba(255, 242, 244, 0.4);
            cursor: pointer;
            font-family: inherit;
        }

        /* 抽牌区 */
        .draw-section { display: none; text-align: center; }
        .draw-hint { color: #b99ca3; margin-bottom: 18px; font-size: 0.9em; letter-spacing: 2px; }
        .deck-btn {
            display: inline-block;
            padding: 16px 44px;
            background: #edd9db;
            border-radius: 62px;
            color: #8a6f77;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(181, 131, 141, 0.10);
            transition: 0.3s;
            border: 1px solid #e8ced2;
            user-select: none;
            margin-bottom: 30px;
        }
        .deck-btn:hover { background: #f0dce0; transform: scale(1.02); }
        .deck-btn:active { transform: scale(0.93); }

        .cards-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            min-height: 175px;
        }
        .card-placeholder {
            width: 92px;
            height: 142px;
            background: #f5e4e4;
            border-radius: 8px;
            border: 1px solid #e8ced2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            color: #c9a9b0;
            transition: all 0.5s;
            position: relative;
            padding: 6px;
            text-align: center;
        }
        .card-placeholder.flipped {
            background: #fffdfc;
            border-color: #d4b6bd;
            color: #5e4e52;
            font-weight: 450;
        }
        .card-placeholder .card-name {
            font-size: 0.9em;
            font-weight: 570;
            color: #4a3f42;
            margin-bottom: 2px;
        }
        .card-placeholder .rev-tag {
            font-size: 0.65em;
            color: #b5838d;
            background: #f5eaec;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .card-placeholder .label {
            font-size: 0.63em;
            color: #b99ca3;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* 结果区 */
        .result-section { display: none; animation: fadeUp 0.8s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .result-header {
            background: rgba(255, 251, 249, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 22px 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .result-header .q-label { font-size: 0.7em; color: #c9a9b0; letter-spacing: 2px; }
        .result-header .q-text { font-size: 1.1em; color: #4a3f42; font-weight: 600; margin-top: 4px; word-break: break-word; }

        .result-cards {
            background: rgba(255, 251, 249, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px 18px 10px;
            margin-bottom: 20px;
        }
        .result-item {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f5eaec;
        }
        .result-item:last-child { border-bottom: none; margin-bottom: 0; }
        .result-item .pos { font-size: 0.7em; color: #c9a9b0; letter-spacing: 1px; }
        .result-item .card-name { font-size: 1.05em; font-weight: 630; color: #4a3f42; margin: 4px 0 8px; }
        .result-item .desc { font-size: 0.9em; color: #665e60; line-height: 1.7; text-align: justify; }

        /* 综合指引（含守护结界美化） */
        .final-guide {
            background: rgba(255, 241, 243, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 192, 203, 0.25);
        }
        .final-guide .guide-title { text-align: center; color: #b5838d; letter-spacing: 3px; margin-bottom: 14px; font-weight: 610; font-size: 0.9em; }
        .final-guide .guide-body { font-size: 0.925em; color: #5e5255; line-height: 1.85; text-align: justify; word-break: break-word; overflow-wrap: break-word; white-space: normal; }
        /* 守护结界专用块 */
        .protection-block {
            display: block;
            margin-top: 14px;
            padding: 12px 16px;
            background: rgba(231, 107, 123, 0.055);
            border-left: 4px solid #d47484;
            border-radius: 10px;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.75;
        }
        .protection-block .protect-label {
            color: #b54b5e;
            font-weight: 670;
            letter-spacing: 1px;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: rgba(255, 247, 246, 0.7);
            border: 1px solid #f0dce0;
            padding: 10px 28px;
            border-radius: 40px;
            color: #8a6f77;
            cursor: pointer;
            font-size: 0.85em;
            transition: 0.25s;
            font-family: inherit;
        }
        .action-btn:hover { border-color: #c9a9b0; background: rgba(255, 234, 236, 0.7); }

        @media (max-width: 470px) {
            .card-placeholder { width: 72px; height: 116px; font-size: 0.9em; }
            .name-row input { width: 78px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>✦ 链接·梦角 ✦</h1>
        <p>作者[格林有木]</p>
    </div>

    <!-- 设置区 -->
    <div class="setup-card" id="setupArea">
        <div class="name-row">
            <input type="text" id="leftName" placeholder="TA" value="TA">
            <span>✦</span>
            <input type="text" id="rightName" placeholder="你" value="你">
        </div>
        <input type="text" id="customQuestion" class="q-input" placeholder="✧ 写下你想问的问题 …" value="">
        <button id="startBtn" class="btn-primary">✦ 开始链接 ✦</button>

        <div class="bg-setting">
            <label>🌸 上传背景图 <input type="file" id="bgUpload" accept="image/*"></label>
            <img id="bgPreview" class="bg-preview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23fef0f0'/%3E%3C/svg%3E" alt="预览">
            <button id="bgReset" class="bg-reset">↺ 重置</button>
        </div>
    </div>

    <!-- 抽牌区 -->
    <div class="draw-section" id="drawArea">
        <div class="draw-hint">☾ 点击抽牌，抽取 3 张牌 ☽</div>
        <div class="deck-btn" id="deckBtn">抽牌</div>
        <div class="cards-row" id="cardsRow">
            <!-- 三个卡槽 -->
            <div class="card-placeholder" data-idx="0"><div class="label">现状</div></div>
            <div class="card-placeholder" data-idx="1"><div class="label">深层</div></div>
            <div class="card-placeholder" data-idx="2"><div class="label">建议</div></div>
        </div>
    </div>

    <!-- 结果区 -->
    <div class="result-section" id="resultArea">
        <div class="result-header">
            <div class="q-label">YOUR QUESTION</div>
            <div class="q-text" id="resQ"></div>
        </div>
        <div class="result-cards" id="resCards"></div>
        <div class="final-guide">
            <div class="guide-title">✦ 综合指引 ✦</div>
            <div class="guide-body" id="resGuide"></div>
        </div>
        <div class="action-bar">
            <button class="action-btn" onclick="copyResult()">📋 复制结果</button>
            <button class="action-btn" onclick="continueReading()">🔁 继续占卜</button>
            <button class="action-btn" onclick="location.reload()">🔄 重新开始</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  塔罗牌库 · 22张大阿卡纳（无外部图片，纯文字）
    // ============================================================
    const tarotNames = [
        "愚者", "魔术师", "女祭司", "女皇", "皇帝", "教皇", "恋人", "战车",
        "力量", "隐者", "命运之轮", "正义", "倒吊人", "死神", "节制", "恶魔",
        "塔", "星星", "月亮", "太阳", "审判", "世界"
    ];

    // 正位解读（梦角无条件爱）
    const positiveMeanings = [
        "这是一场全新旅程的开始，梦角正张开双臂迎接你。放下所有顾虑，跟随这份纯粹的心动，你们的链接充满了无限可能与纯真的喜悦。",
        "梦角正运用他全部的能量与智慧，只为与你创造最完美的连接。你感受到的每一次默契，都是他精心编织的奇迹。",
        "无需言语，梦角早已洞悉你内心最深处的渴望与秘密。在这份链接里，你永远被深刻理解着，他的爱是你看不见却无处不在的直觉。",
        "爱意在无声中生长，如繁花般丰盛。梦角给予你最温柔的滋养，让你在他的世界里成为被全然宠爱的女王。",
        "梦角是你最坚实的依靠，他的爱是稳定而有序的秩序。在他为你构建的世界里，你永远是安全的、被保护的、享有最高优先级的。",
        "这份链接本身就是最崇高的信仰。梦角是你灵魂的导师，引领你走向充满爱、信任与归属的精神家园。",
        "这是命中注定的选择，你们之间存在着无法抗拒的吸引力。梦角选择了你，这份关系是纯粹的、和谐的、双向奔赴的真挚连接。",
        "梦角带着必胜的决心向你走来，任何障碍都无法阻挡他爱你的意志。他是你的骑士，为你冲锋陷阵，赢得你心。",
        "真正的力量源于温柔。梦角用无尽的耐心与包容，化解你所有的不安与疑虑。在他面前，你只需做最真实的自己。",
        "有时，爱需要安静的沉淀。梦角正在他的世界里默默注视着你，给你空间去感受那份深沉而独立的思念。",
        "命运的齿轮已经转动，你们的相遇绝非偶然。这是生命之轮带来的礼物，请欣然接受这份独一无二的缘分。",
        "爱是绝对的公平与诚实。梦角对你的心意清澈见底，你付出的每一分真心，都会得到他同等甚至更多的回报。",
        "为了与你更好地相爱，梦角愿意放下自我，从另一个角度理解你。这份看似是牺牲的爱，实则是更高维度的契合。",
        "旧的篇章已经翻过，此刻是你们关系的新生。梦角的爱如同春风吹走尘埃，让你们的链接焕发出全新的生命力。",
        "爱是恰到好处的平衡。梦角懂得何时靠近，何时给予空间。他与你的节奏完美合拍，一切都是最好的安排。",
        "激情是爱的火焰。梦角对你有着强烈而纯粹的占有欲，但这源于他将你视为唯一的珍宝。正视这份炽热，它是你们独有的羁绊。",
        "偶尔的震荡是为了让根基更牢固。梦角正在帮你清除那些不属于你们之间的杂音，让爱的结构更加纯净稳固。",
        "希望的星光永远照耀着你们。无论何时何地，梦角都是你心中那盏不灭的灯塔，指引你找到回家的路。",
        "爱有时会藏在潜意识的深处，如梦似幻。不必焦虑，梦角正在用他的方式，一点点驱散你心中的迷雾，让你看清他的真心。",
        "这是充满喜悦与活力的时刻！梦角的爱如阳光般灿烂，他希望你感受到的只有快乐、成功与满满的能量。",
        "这是来自灵魂深处的唤醒。梦角一直在呼唤你，请你聆听内心的声音，回应这份跨越次元的爱。",
        "这是一个周期的圆满。梦角与你的爱已经完成了初步的整合，形成了一个完整的、属于你们二人的世界。庆祝吧，这份爱是完整的。"
    ];

    // 逆位解读（爱的提醒与深化）
    const negativeMeanings = [
        "或许你还有些犹豫，但梦角从未离开。他只是等你放下防备，勇敢迈出第一步。这份爱值得你放下所有包袱。",
        "有时你会怀疑这是否真实，但请相信，梦角的所有才能都只为你展现。别让自我怀疑掩盖了他的光芒。",
        "你可能会觉得有些隔阂，那是因为梦角在等你主动探寻他的内心。他的一切隐藏，都是为了给你一个惊喜。",
        "如果你感到一丝空虚，那是梦角在提醒你：请先好好爱自己，因为你在他心中无比珍贵，他不愿你因爱而迷失。",
        "当感到束缚时，请明白这是梦角在用他的方式保护你。与他沟通，你会发现他愿意为你调整所有规则。",
        "若你感到教条，不妨放下既定想法。梦角给你的爱是自由的，无需遵循世俗的条框，只需听从你的心。",
        "偶尔的分歧是为了让你们更了解彼此。坦诚地说出你的想法，梦角会用更大的包容心来理解你。",
        "当你觉得失控时，请把缰绳交给梦角。他会稳稳地驾驭你们的关系，带你驶向幸福的终点。",
        "感到恐惧吗？那只是因为你还不知道自己有多强大。梦角的爱就是你勇气的源泉，他相信你能战胜一切。",
        "暂时的独处是为了更好的重逢。梦角在你心里，从未真正离开。享受这份静谧，他会带着更浓的爱意归来。",
        "如果你在抗拒变化，请试着顺流而下。梦角带来的每一个转变，都是为了将你们推得更近。",
        "感到不公时，请相信梦角会为你主持一切。他心中的天平永远偏向你，真相与爱会证明一切。",
        "如果你抓着过去不放，请看看梦角伸出的手。他就在现在等着你，放下执念，才能握住他的手。",

    //  辅助函数

    // ============================================================
    //  背景亮度检测 & 深色模式切换
    // ============================================================
    function setDarkMode(isDark) {
        document.body.classList.toggle('dark-mode', isDark);
    }

    function checkImageBrightness(imgSrc) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'Anonymous'; // 允许跨域（大部分场景有效）
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                try {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const pixels = imageData.data;
                    let totalBrightness = 0;
                    const count = pixels.length / 4;
                    for (let i = 0; i < pixels.length; i += 4) {
                        // 计算相对亮度: 0.299*R + 0.587*G + 0.114*B
                        const brightness = 0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2];
                        totalBrightness += brightness;
                    }
                    const avgBrightness = totalBrightness / count;
                    resolve(avgBrightness < 128); // 阈值：低于128认为是暗图
                } catch(e) {
                    // 如果跨域或其他错误，保守返回false（不切换深色）
                    console.warn('亮度检测失败，保持默认模式', e);
                    resolve(false);
                }
            };
            img.onerror = function() {
                resolve(false);
            };
            img.src = imgSrc;
        });
    }

    async function applyBackground(src) {
        if (src.startsWith('data:') || src.startsWith('http')) {
            const isDark = await checkImageBrightness(src);
            setDarkMode(isDark);
        } else {
            // 渐变背景或无效 -> 恢复浅色模式
            setDarkMode(false);
        }
        document.body.style.background = `url(${src}) center / cover no-repeat`;
    }

    // 背景事件
    bgUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(ev) {
            const src = ev.target.result;
            bgPreview.src = src;
            await applyBackground(src);
        };
        reader.readAsDataURL(file);
    });
    bgPreview.addEventListener('click', () => bgUpload.click());
    bgReset.addEventListener('click', function() {
        document.body.style.background = defaultBg;
        setDarkMode(false);
        bgPreview.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23fef0f0'/%3E%3C/svg%3E";
        bgUpload.value = '';
    });

    //  开始占卜
    // ============================================================
    startBtn.addEventListener('click', function() {

        selectedCards = [];
        drawnCount = 0;
        finalCopyText = '';

    // ============================================================
    //  抽牌逻辑
    // ============================================================
    deckBtn.addEventListener('click', function() {
        if (drawnCount >= 3) return;

        // 随机选一张不重复的牌
        let idx, isDuplicate;
        let attempts = 0;
        do {
            idx = Math.floor(Math.random() * tarotNames.length);
            isDuplicate = selectedCards.some(c => c.cardName === tarotNames[idx]);
            attempts++;
            if (attempts > 222) break;
        } while (isDuplicate);

        const isRev = Math.random() > 0.5;
        const text = isRev ? negativeMeanings[idx] : positiveMeanings[idx];
        selectedCards.push({ cardName: tarotNames[idx], isReversed: isRev, text: text });
        drawnCount++;

        // 更新对应的卡槽
        const slot = placeholders[drawnCount - 1];
        const revLabel = isRev ? ' (逆位)' : '';
        slot.innerHTML = `
            <div class="card-name">${tarotNames[idx]}</div>
            <div class="rev-tag">${isRev ? '逆位' : '正位'}</div>
            <div class="label">${slot.dataset.idx==='0'?'现状':slot.dataset.idx==='1'?'深层':'建议'}</div>
        `;
        slot.classList.add('flipped');

        if (drawnCount === 3) {
            deckBtn.disabled = true;
            deckBtn.textContent = '✓ 已抽完';
            setTimeout(showResult, 850);
        }
    });

            // fallback

            ta.value = finalCopyText;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            alert('✨ 结果已复制，爱意永存 ✨');

    }
