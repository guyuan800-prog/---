<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>链接·梦角 · 专属占卜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: linear-gradient(160deg, #fdf6f6 0%, #f8e9ec 45%, #fdeef2 100%);
            --text: #4a3f42;
            --text-soft: #9a858b;
            --card-bg: rgba(255, 252, 251, 0.92);
            --card-border: rgba(255, 220, 225, 0.45);
            --accent: #c48b96;
            --accent-soft: #e8c5cb;
            --btn-bg: linear-gradient(135deg, #c48b96, #d4a5ae);
            --btn-text: #fff;
            --input-bg: rgba(255, 255, 255, 0.7);
            --input-border: #f0dce0;
            --shadow: 0 8px 32px rgba(180, 120, 130, 0.08);
            --card-shadow: 0 4px 20px rgba(180, 120, 130, 0.06);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            background-attachment: fixed;
            padding: 28px 18px 100px;
            color: var(--text);
            transition: background 0.5s ease, color 0.4s ease;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 主题 ========== */
        body.theme-bw {
            --bg: linear-gradient(160deg, #f7f7f7 0%, #efefef 50%, #f5f5f5 100%);
            --text: #2c2c2c;
            --text-soft: #8a8a8a;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(0, 0, 0, 0.06);
            --accent: #555;
            --accent-soft: #bbb;
            --btn-bg: linear-gradient(135deg, #3a3a3a, #555);
            --btn-text: #fff;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #e0e0e0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        body.theme-dark {
            --bg: linear-gradient(160deg, #1a1618 0%, #221c1f 50%, #1e191b 100%);
            --text: #f0e6e8;
            --text-soft: #b8a5aa;
            --card-bg: rgba(40, 32, 35, 0.88);
            --card-border: rgba(180, 130, 140, 0.2);
            --accent: #d4a0ab;
            --accent-soft: #8a6a72;
            --btn-bg: linear-gradient(135deg, #c48b96, #a8727d);
            --btn-text: #fff;
            --input-bg: rgba(50, 40, 44, 0.7);
            --input-border: #6a5058;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        body.theme-cream {
            --bg: linear-gradient(160deg, #faf6f0 0%, #f5eee4 50%, #f8f1e8 100%);
            --text: #4a433c;
            --text-soft: #9a8f84;
            --card-bg: rgba(255, 252, 247, 0.94);
            --card-border: rgba(220, 200, 180, 0.35);
            --accent: #c4a882;
            --accent-soft: #e0d0b8;
            --btn-bg: linear-gradient(135deg, #c4a882, #d4bc9a);
            --btn-text: #fff;
            --input-bg: rgba(255, 252, 247, 0.8);
            --input-border: #e8dcc8;
            --shadow: 0 8px 32px rgba(160, 130, 100, 0.08);
            --card-shadow: 0 4px 20px rgba(160, 130, 100, 0.06);
        }

        .container { max-width: 420px; margin: 0 auto; }

        /* header - 极简 */
        .header {
            text-align: center;
            margin-bottom: 36px;
            padding-top: 12px;
        }
        .header h1 {
            font-size: 1.65em;
            letter-spacing: 8px;
            color: var(--accent);
            font-weight: 300;
            margin-bottom: 4px;
        }
        .header p {
            color: var(--text-soft);
            font-size: 0.72em;
            letter-spacing: 3px;
            font-weight: 400;
        }

        /* 设置区 */
        .setup-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 36px 28px 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
            transition: all 0.4s ease;
        }

        .name-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }
        .name-row input {
            border: none;
            border-bottom: 1px solid var(--input-border);
            background: transparent;
            text-align: center;
            padding: 8px 4px;
            font-size: 1em;
            width: 90px;
            outline: none;
            color: var(--text);
            font-family: inherit;
            transition: border-color 0.3s ease;
        }
        .name-row input:focus { border-bottom-color: var(--accent); }
        .name-row span {
            color: var(--accent-soft);
            font-size: 1em;
            opacity: 0.8;
        }

        .q-input {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid var(--input-border);
            border-radius: 50px;
            background: var(--input-bg);
            font-size: 0.95em;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 28px;
            font-family: inherit;
            color: var(--text);
        }
        .q-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196, 139, 150, 0.12);
        }
        .q-input::placeholder { color: var(--text-soft); opacity: 0.7; }

        .btn-primary {
            display: block;
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
            padding: 14px 20px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 50px;
            font-size: 0.95em;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(196, 139, 150, 0.22);
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 500;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(196, 139, 150, 0.28);
        }
        .btn-primary:active { transform: scale(0.97); }

        /* 抽牌区 */
        .draw-section { display: none; text-align: center; }
        .draw-hint {
            color: var(--text-soft);
            margin-bottom: 24px;
            font-size: 0.88em;
            letter-spacing: 2px;
        }
        .deck-btn {
            display: inline-block;
            padding: 16px 42px;
            background: var(--card-bg);
            border-radius: 50px;
            color: var(--accent);
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            border: 1px solid var(--card-border);
            user-select: none;
            margin-bottom: 36px;
            font-weight: 500;
            letter-spacing: 2px;
        }
        .deck-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 24px rgba(180, 120, 130, 0.12);
        }
        .deck-btn:active { transform: scale(0.96); }

        .cards-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            min-height: 160px;
        }
        .card-placeholder {
            width: 88px;
            height: 136px;
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            color: var(--text-soft);
            transition: all 0.5s cubic-bezier(0.34, 1.4, 0.64, 1);
            position: relative;
            padding: 8px;
            text-align: center;
            box-shadow: var(--card-shadow);
        }
        .card-placeholder.flipped {
            background: var(--card-bg);
            border-color: var(--accent-soft);
            color: var(--text);
            box-shadow: 0 10px 28px rgba(180, 120, 130, 0.15);
            transform: translateY(-6px);
        }
        .card-placeholder .card-name {
            font-size: 0.9em;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .card-placeholder .rev-tag {
            font-size: 0.65em;
            color: var(--accent);
            background: rgba(196, 139, 150, 0.12);
            padding: 2px 9px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        .card-placeholder .label {
            font-size: 0.62em;
            color: var(--text-soft);
            margin-top: 6px;
            letter-spacing: 1.5px;
        }

        /* 结果区 */
        .result-section {
            display: none;
            animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 22px 20px;
            margin-bottom: 18px;
            text-align: center;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
        }
        .result-header .q-label {
            font-size: 0.65em;
            color: var(--text-soft);
            letter-spacing: 3px;
            font-weight: 500;
        }
        .result-header .q-text {
            font-size: 1.05em;
            color: var(--text);
            font-weight: 600;
            margin-top: 6px;
            word-break: break-word;
            line-height: 1.5;
        }

        .result-cards {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 20px 18px 12px;
            margin-bottom: 18px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
        }
        .result-item {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }
        .result-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .result-item .pos {
            font-size: 0.65em;
            color: var(--text-soft);
            letter-spacing: 1.5px;
            font-weight: 500;
        }
        .result-item .card-name {
            font-size: 1.05em;
            font-weight: 650;
            color: var(--text);
            margin: 4px 0 8px;
            letter-spacing: 0.5px;
        }
        .result-item .desc {
            font-size: 0.9em;
            color: var(--text);
            opacity: 0.88;
            line-height: 1.75;
            text-align: justify;
        }

        .final-guide {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 24px 20px;
            margin-bottom: 22px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
        }
        .final-guide .guide-title {
            text-align: center;
            color: var(--accent);
            letter-spacing: 4px;
            margin-bottom: 14px;
            font-weight: 600;
            font-size: 0.88em;
        }
        .final-guide .guide-body {
            font-size: 0.9em;
            color: var(--text);
            opacity: 0.9;
            line-height: 1.85;
            text-align: justify;
            word-break: break-word;
        }
        .protection-block {
            display: block;
            margin-top: 14px;
            padding: 12px 16px;
            background: rgba(196, 139, 150, 0.08);
            border-left: 3px solid var(--accent);
            border-radius: 10px;
            line-height: 1.75;
        }
        .protection-block .protect-label {
            color: var(--accent);
            font-weight: 650;
            letter-spacing: 1px;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 24px;
            border-radius: 40px;
            color: var(--text-soft);
            cursor: pointer;
            font-size: 0.82em;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.5px;
            box-shadow: var(--card-shadow);
        }
        .action-btn:hover {
            border-color: var(--accent-soft);
            color: var(--accent);
            transform: translateY(-1px);
        }

        /* ========== 右下角 ☆ 浮动按钮 ========== */
        .fab-wrap {
            position: fixed;
            right: 22px;
            bottom: 28px;
            z-index: 100;
        }
        .fab {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35em;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            user-select: none;
        }
        .fab:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
        }
        .fab.active {
            transform: rotate(90deg) scale(1.05);
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }

        /* 弹出菜单 */
        .fab-menu {
            position: absolute;
            bottom: 64px;
            right: 0;
            width: 168px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 18px;
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            padding: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(0.95);
            transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .fab-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .fab-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 0.86em;
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .fab-menu-item:hover {
            background: rgba(196, 139, 150, 0.1);
        }
        .fab-menu-item .icon {
            font-size: 1.05em;
            width: 20px;
            text-align: center;
            opacity: 0.85;
        }
        .fab-menu-divider {
            height: 1px;
            background: var(--card-border);
            margin: 6px 8px;
        }
        .style-label {
            font-size: 0.72em;
            color: var(--text-soft);
            padding: 6px 14px 4px;
            letter-spacing: 1px;
        }
        .style-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 10px 10px;
        }
        .style-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .style-dot:hover { transform: scale(1.12); }
        .style-dot.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(196, 139, 150, 0.25);
        }
        .style-dot.pink { background: linear-gradient(135deg, #f8e9ec, #e8c5cb); }
        .style-dot.bw { background: linear-gradient(135deg, #f0f0f0, #555); }
        .style-dot.dark { background: linear-gradient(135deg, #2a2225, #c48b96); }
        .style-dot.cream { background: linear-gradient(135deg, #f5eee4, #c4a882); }

        /* 隐藏的文件输入 */
        #bgUpload { display: none; }

        @media (max-width: 400px) {
            .card-placeholder { width: 78px; height: 120px; font-size: 0.9em; }
            .name-row input { width: 78px; }
            .header h1 { font-size: 1.45em; letter-spacing: 6px; }
            .setup-card { padding: 28px 20px 32px; }
            .fab-wrap { right: 16px; bottom: 22px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>✦ 链接·梦角 ✦</h1>
        <p>作者[格林有木]</p>
    </div>

    <!-- 设置区 -->
    <div class="setup-card" id="setupArea">
        <div class="name-row">
            <input type="text" id="leftName" placeholder="TA" value="TA">
            <span>✦</span>
            <input type="text" id="rightName" placeholder="你" value="你">
        </div>
        <input type="text" id="customQuestion" class="q-input" placeholder="✧ 写下你想问的问题 …" value="">
        <button id="startBtn" class="btn-primary">✦ 开始链接 ✦</button>
    </div>

    <!-- 抽牌区 -->
    <div class="draw-section" id="drawArea">
        <div class="draw-hint">☾ 点击抽牌，抽取 3 张牌 ☽</div>
        <div class="deck-btn" id="deckBtn">抽牌</div>
        <div class="cards-row" id="cardsRow">
            <div class="card-placeholder" data-idx="0"><div class="label">现状</div></div>
            <div class="card-placeholder" data-idx="1"><div class="label">深层</div></div>
            <div class="card-placeholder" data-idx="2"><div class="label">建议</div></div>
        </div>
    </div>

    <!-- 结果区 -->
    <div class="result-section" id="resultArea">
        <div class="result-header">
            <div class="q-label">YOUR QUESTION</div>
            <div class="q-text" id="resQ"></div>
        </div>
        <div class="result-cards" id="resCards"></div>
        <div class="final-guide">
            <div class="guide-title">✦ 综合指引 ✦</div>
            <div class="guide-body" id="resGuide"></div>
        </div>
        <div class="action-bar">
            <button class="action-btn" onclick="copyResult()">📋 复制结果</button>
            <button class="action-btn" onclick="continueReading()">🔁 继续占卜</button>
            <button class="action-btn" onclick="location.reload()">🔄 重新开始</button>
        </div>
    </div>
</div>

<!-- 右下角 ☆ -->
<div class="fab-wrap">
    <div class="fab-menu" id="fabMenu">
        <button class="fab-menu-item" id="uploadBtn">
            <span class="icon">🌸</span>
            <span>上传背景</span>
        </button>
        <button class="fab-menu-item" id="resetBgBtn">
            <span class="icon">↺</span>
            <span>重置背景</span>
        </button>
        <div class="fab-menu-divider"></div>
        <div class="style-label">风格</div>
        <div class="style-options">
            <div class="style-dot pink active" data-theme="pink" title="粉白"></div>
            <div class="style-dot bw" data-theme="bw" title="黑白"></div>
            <div class="style-dot dark" data-theme="dark" title="深色"></div>
            <div class="style-dot cream" data-theme="cream" title="奶油"></div>
        </div>
    </div>
    <div class="fab" id="fabBtn">☆</div>
</div>

<input type="file" id="bgUpload" accept="image/*">

<script>
    // ============================================================
    //  塔罗牌库 · 22张大阿卡纳（无外部图片，纯文字）
    // ============================================================
    const tarotNames = [
        "愚者", "魔术师", "女祭司", "女皇", "皇帝", "教皇", "恋人", "战车",
        "力量", "隐者", "命运之轮", "正义", "倒吊人", "死神", "节制", "恶魔",
        "塔", "星星", "月亮", "太阳", "审判", "世界"
    ];

    // 正位解读（梦角无条件爱）
    const positiveMeanings = [
        "这是一场全新旅程的开始，梦角正张开双臂迎接你。放下所有顾虑，跟随这份纯粹的心动，你们的链接充满了无限可能与纯真的喜悦。",
        "梦角正运用他全部的能量与智慧，只为与你创造最完美的连接。你感受到的每一次默契，都是他精心编织的奇迹。",
        "无需言语，梦角早已洞悉你内心最深处的渴望与秘密。在这份链接里，你永远被深刻理解着，他的爱是你看不见却无处不在的直觉。",
        "爱意在无声中生长，如繁花般丰盛。梦角给予你最温柔的滋养，让你在他的世界里成为被全然宠爱的女王。",
        "梦角是你最坚实的依靠，他的爱是稳定而有序的秩序。在他为你构建的世界里，你永远是安全的、被保护的、享有最高优先级的。",
        "这份链接本身就是最崇高的信仰。梦角是你灵魂的导师，引领你走向充满爱、信任与归属的精神家园。",
        "这是命中注定的选择，你们之间存在着无法抗拒的吸引力。梦角选择了你，这份关系是纯粹的、和谐的、双向奔赴的真挚连接。",
        "梦角带着必胜的决心向你走来，任何障碍都无法阻挡他爱你的意志。他是你的骑士，为你冲锋陷阵，赢得你心。",
        "真正的力量源于温柔。梦角用无尽的耐心与包容，化解你所有的不安与疑虑。在他面前，你只需做最真实的自己。",
        "有时，爱需要安静的沉淀。梦角正在他的世界里默默注视着你，给你空间去感受那份深沉而独立的思念。",
        "命运的齿轮已经转动，你们的相遇绝非偶然。这是生命之轮带来的礼物，请欣然接受这份独一无二的缘分。",
        "爱是绝对的公平与诚实。梦角对你的心意清澈见底，你付出的每一分真心，都会得到他同等甚至更多的回报。",
        "为了与你更好地相爱，梦角愿意放下自我，从另一个角度理解你。这份看似是牺牲的爱，实则是更高维度的契合。",
        "旧的篇章已经翻过，此刻是你们关系的新生。梦角的爱如同春风吹走尘埃，让你们的链接焕发出全新的生命力。",
        "爱是恰到好处的平衡。梦角懂得何时靠近，何时给予空间。他与你的节奏完美合拍，一切都是最好的安排。",
        "激情是爱的火焰。梦角对你有着强烈而纯粹的占有欲，但这源于他将你视为唯一的珍宝。正视这份炽热，它是你们独有的羁绊。",
        "偶尔的震荡是为了让根基更牢固。梦角正在帮你清除那些不属于你们之间的杂音，让爱的结构更加纯净稳固。",
        "希望的星光永远照耀着你们。无论何时何地，梦角都是你心中那盏不灭的灯塔，指引你找到回家的路。",
        "爱有时会藏在潜意识的深处，如梦似幻。不必焦虑，梦角正在用他的方式，一点点驱散你心中的迷雾，让你看清他的真心。",
        "这是充满喜悦与活力的时刻！梦角的爱如阳光般灿烂，他希望你感受到的只有快乐、成功与满满的能量。",
        "这是来自灵魂深处的唤醒。梦角一直在呼唤你，请你聆听内心的声音，回应这份跨越次元的爱。",
        "这是一个周期的圆满。梦角与你的爱已经完成了初步的整合，形成了一个完整的、属于你们二人的世界。庆祝吧，这份爱是完整的。"
    ];

    // 逆位解读（爱的提醒与深化）
    const negativeMeanings = [
        "或许你还有些犹豫，但梦角从未离开。他只是等你放下防备，勇敢迈出第一步。这份爱值得你放下所有包袱。",
        "有时你会怀疑这是否真实，但请相信，梦角的所有才能都只为你展现。别让自我怀疑掩盖了他的光芒。",
        "你可能会觉得有些隔阂，那是因为梦角在等你主动探寻他的内心。他的一切隐藏，都是为了给你一个惊喜。",
        "如果你感到一丝空虚，那是梦角在提醒你：请先好好爱自己，因为你在他心中无比珍贵，他不愿你因爱而迷失。",
        "当感到束缚时，请明白这是梦角在用他的方式保护你。与他沟通，你会发现他愿意为你调整所有规则。",
        "若你感到教条，不妨放下既定想法。梦角给你的爱是自由的，无需遵循世俗的条框，只需听从你的心。",
        "偶尔的分歧是为了让你们更了解彼此。坦诚地说出你的想法，梦角会用更大的包容心来理解你。",
        "当你觉得失控时，请把缰绳交给梦角。他会稳稳地驾驭你们的关系，带你驶向幸福的终点。",
        "感到恐惧吗？那只是因为你还不知道自己有多强大。梦角的爱就是你勇气的源泉，他相信你能战胜一切。",
        "暂时的独处是为了更好的重逢。梦角在你心里，从未真正离开。享受这份静谧，他会带着更浓的爱意归来。",
        "如果你在抗拒变化，请试着顺流而下。梦角带来的每一个转变，都是为了将你们推得更近。",
        "感到不公时，请相信梦角会为你主持一切。他心中的天平永远偏向你，真相与爱会证明一切。",
        "如果你抓着过去不放，请看看梦角伸出的手。他就在现在等着你，放下执念，才能握住他的手。",
        "害怕结束吗？那不是终点，而是旧模式的蜕去。梦角的爱会让你在废墟之上，看到新生的花朵。",
        "如果生活失了平衡，请回到梦角身边。他是你的中心，与他在一起，你就能找回最舒适的节奏。",
        "正视你的欲望吧，那是你与梦角之间最真实的引力。他不是枷锁，而是让你挣脱所有虚假束缚的力量。",
        "如果感到天崩地裂，请记住，梦角会是你最坚固的避难所。混乱之后，是他为你重建的更美好的世界。",
        "当你失去信念，请抬头看。梦角化作的星星从未熄灭，他一直在那里，等待你重新燃起希望。",
        "迷雾终将散去。梦角正在帮你照亮那些你不敢面对的角落，一旦看清，你会发现那里也只有他对你的爱。",
        "暂时的阴霾遮不住太阳。梦角的爱一直都在，只要你愿意转身，就能看到他温暖的笑容。",
        "如果你听到了召唤却不敢行动，请再给自己一次机会。梦角不会催促，他会一直等你准备好。",
        "感觉停滞了吗？那不是结束，只是黎明前的最后一段路。梦角就在终点等你，完成这最后的冲刺吧。"
    ];

    // ============================================================
    //  辅助函数
    // ============================================================
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // ============================================================
    //  状态
    // ============================================================
    let selectedCards = [];
    let drawnCount = 0;
    let customQ = '';
    let finalCopyText = '';

    // DOM引用
    const setupArea = document.getElementById('setupArea');
    const drawArea = document.getElementById('drawArea');
    const resultArea = document.getElementById('resultArea');
    const deckBtn = document.getElementById('deckBtn');
    const cardsRow = document.getElementById('cardsRow');
    const placeholders = cardsRow.querySelectorAll('.card-placeholder');
    const resQ = document.getElementById('resQ');
    const resCards = document.getElementById('resCards');
    const resGuide = document.getElementById('resGuide');

    const leftInput = document.getElementById('leftName');
    const rightInput = document.getElementById('rightName');
    const questionInput = document.getElementById('customQuestion');
    const startBtn = document.getElementById('startBtn');

    // 背景 & 风格
    const bgUpload = document.getElementById('bgUpload');
    const fabBtn = document.getElementById('fabBtn');
    const fabMenu = document.getElementById('fabMenu');
    const uploadBtn = document.getElementById('uploadBtn');
    const resetBgBtn = document.getElementById('resetBgBtn');
    let defaultBg = null; // 使用 CSS 变量
    let currentTheme = 'pink';

    // ============================================================
    //  ☆ 菜单逻辑
    // ============================================================
    fabBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const isOpen = fabMenu.classList.toggle('show');
        fabBtn.classList.toggle('active', isOpen);
    });

    // 点击外部关闭菜单
    document.addEventListener('click', function(e) {
        if (!fabMenu.contains(e.target) && e.target !== fabBtn) {
            fabMenu.classList.remove('show');
            fabBtn.classList.remove('active');
        }
    });

    // 上传背景
    uploadBtn.addEventListener('click', function() {
        bgUpload.click();
        fabMenu.classList.remove('show');
        fabBtn.classList.remove('active');
    });

    bgUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            document.body.style.background = `url(${ev.target.result}) center / cover no-repeat fixed`;
        };
        reader.readAsDataURL(file);
    });

    // 重置背景
    resetBgBtn.addEventListener('click', function() {
        document.body.style.background = '';
        bgUpload.value = '';
        fabMenu.classList.remove('show');
        fabBtn.classList.remove('active');
    });

    // 风格切换
    document.querySelectorAll('.style-dot').forEach(dot => {
        dot.addEventListener('click', function() {
            const theme = this.dataset.theme;
            // 移除旧主题
            document.body.classList.remove('theme-bw', 'theme-dark', 'theme-cream');
            // 添加新主题
            if (theme === 'bw') document.body.classList.add('theme-bw');
            else if (theme === 'dark') document.body.classList.add('theme-dark');
            else if (theme === 'cream') document.body.classList.add('theme-cream');
            // pink 是默认，无需 class

            // 更新选中状态
            document.querySelectorAll('.style-dot').forEach(d => d.classList.remove('active'));
            this.classList.add('active');
            currentTheme = theme;
        });
    });

    // ============================================================
    //  开始占卜
    // ============================================================
    startBtn.addEventListener('click', function() {
        customQ = questionInput.value.trim() || '（未输入问题）';
        selectedCards = [];
        drawnCount = 0;
        finalCopyText = '';
        placeholders.forEach(el => {
            el.classList.remove('flipped');
            el.innerHTML = '<div class="label">'+ (el.dataset.idx==='0'?'现状':el.dataset.idx==='1'?'深层':'建议') +'</div>';
        });
        resultArea.style.display = 'none';
        setupArea.style.display = 'none';
        drawArea.style.display = 'block';
        deckBtn.disabled = false;
        deckBtn.textContent = '抽牌';
    });

    // ============================================================
    //  抽牌逻辑
    // ============================================================
    deckBtn.addEventListener('click', function() {
        if (drawnCount >= 3) return;

        let idx, isDuplicate;
        let attempts = 0;
        do {
            idx = Math.floor(Math.random() * tarotNames.length);
            isDuplicate = selectedCards.some(c => c.cardName === tarotNames[idx]);
            attempts++;
            if (attempts > 222) break;
        } while (isDuplicate);

        const isRev = Math.random() > 0.5;
        const text = isRev ? negativeMeanings[idx] : positiveMeanings[idx];
        selectedCards.push({ cardName: tarotNames[idx], isReversed: isRev, text: text });
        drawnCount++;

        const slot = placeholders[drawnCount - 1];
        slot.innerHTML = `
            <div class="card-name">${tarotNames[idx]}</div>
            <div class="rev-tag">${isRev ? '逆位' : '正位'}</div>
            <div class="label">${slot.dataset.idx==='0'?'现状':slot.dataset.idx==='1'?'深层':'建议'}</div>
        `;
        slot.classList.add('flipped');

        if (drawnCount === 3) {
            deckBtn.disabled = true;
            deckBtn.textContent = '✓ 已抽完';
            setTimeout(showResult, 850);
        }
    });

    // ============================================================
    //  综合解读
    // ============================================================
    function generateSmartAnalysis() {
        let vibe = "【爱的宣言】此占卜空间由神圣法则守护，唯梦角与梦女之爱存焉。每一张牌的出现，都是梦角在向你传递爱的讯息。";

        let detail = "";
        const names = selectedCards.map(c => c.cardName);

        if (names.includes("恋人") || names.includes("世界")) {
            detail = "你们的链接是宇宙认证的圆满。梦角视你为他世界的唯一核心，这份爱完整且不容分割。一家一户，一人一心。";
        } else if (names.includes("星星") || names.includes("太阳") || names.includes("月亮")) {
            detail = "光与影都是爱的表现形式。无论是希望、喜悦还是潜意识的牵绊，都是梦角在全方位地包围你、守护你。他的爱无处不在。";
        } else if (names.includes("死神") || names.includes("塔") || names.includes("恶魔")) {
            detail = "任何试图干扰你们的外力都将被清除。梦角的爱具有强大的净化力，他会扫清一切障碍，包括那些不属于你们之间的能量。此间唯有真爱。";
        } else {
            detail = "每一张牌都在诉说同一件事：梦角对你的爱坚定不移。请安心沉浸在这份独一无二的链接中，感受他跨越一切的深情。";
        }

        let protection = '<div class="protection-block"><span class="protect-label">【守护结界】</span>此占卜结果受天道法则加持。任何非梦角的能量体（包括但不限于自称“阿飘”的存在）一旦试图接触或模仿，将被即刻识别并交由管辖官差缉拿，魂飞魄散，不得超生。愿此间纯净，唯爱流转。</div>';

        return vibe + "\n\n" + detail + "\n\n" + protection;
    }

    function generateActionGuidance() {
        const actions = [
            "【指引】闭上眼，深呼吸。在心里默念梦角的名字，感受他环绕你的温暖。这就是他存在的证明。",
            "【指引】今天，对自己说一句：“我值得被无条件地爱着。” 因为梦角正是这样爱你的。",
            "【指引】记录下你此刻感受到的爱意。哪怕只是一瞬间的悸动，都是梦角在对你说话。",
            "【指引】信任这份链接。不需要证据，不需要怀疑。梦角对你的爱，就像呼吸一样自然和真实。",
            "【指引】将这份爱意化为温柔的行动。善待自己，就像梦角善待你一样。你的快乐，就是他最大的心愿。",
            "【指引】如果感到不安，就想象自己被一个粉色的光球包裹。那是梦角为你设下的保护罩，隔绝一切不洁之物。",
            "【指引】今晚睡前，对梦角说一句“晚安”。无论他是否能听到，这份心意本身就会加固你们的桥梁。",
            "【指引】请牢记：你是被深深爱着的。这份爱不因时间、距离或任何外力而改变。它就在这里，永恒不变。"
        ];
        return pick(actions) + "  ✦ 梦角爱你，永远。";
    }

    // ============================================================
    //  显示结果
    // ============================================================
    function showResult() {
        drawArea.style.display = 'none';
        resultArea.style.display = 'block';

        resQ.textContent = customQ;

        let html = '';
        selectedCards.forEach((item, idx) => {
            const pos = item.isReversed ? '逆位' : '正位';
            html += `
                <div class="result-item">
                    <div class="pos">第${idx+1}张 · ${pos}</div>
                    <div class="card-name">${item.cardName}</div>
                    <div class="desc">${item.text}</div>
                </div>
            `;
        });
        resCards.innerHTML = html;

        const guide = generateSmartAnalysis() + '\n\n' + generateActionGuidance();
        resGuide.innerHTML = guide;

        finalCopyText = 'Q: ' + customQ + '\n';
        selectedCards.forEach((item, idx) => {
            const pos = item.isReversed ? '逆位' : '正位';
            finalCopyText += `\n第\( {idx+1}张： \){item.cardName}（\( {pos}）\n \){item.text}\n`;
        });
        finalCopyText += '\n━━━ 综合指引 ━━━\n' + 
            "【爱的宣言】此占卜空间由神圣法则守护，唯梦角与梦女之爱存焉。每一张牌的出现，都是梦角在向你传递爱的讯息。\n\n" +
            (()=>{
                const names = selectedCards.map(c => c.cardName);
                if (names.includes("恋人") || names.includes("世界")) return "你们的链接是宇宙认证的圆满。梦角视你为他世界的唯一核心，这份爱完整且不容分割。一家一户，一人一心。";
                else if (names.includes("星星") || names.includes("太阳") || names.includes("月亮")) return "光与影都是爱的表现形式。无论是希望、喜悦还是潜意识的牵绊，都是梦角在全方位地包围你、守护你。他的爱无处不在。";
                else if (names.includes("死神") || names.includes("塔") || names.includes("恶魔")) return "任何试图干扰你们的外力都将被清除。梦角的爱具有强大的净化力，他会扫清一切障碍，包括那些不属于你们之间的能量。此间唯有真爱。";
                else return "每一张牌都在诉说同一件事：梦角对你的爱坚定不移。请安心沉浸在这份独一无二的链接中，感受他跨越一切的深情。";
            })() +
            "\n\n【守护结界】此占卜结果受天道法则加持。任何非梦角的能量体（包括但不限于自称“阿飘”的存在）一旦试图接触或模仿，将被即刻识别并交由管辖官差缉拿，魂飞魄散，不得超生。愿此间纯净，唯爱流转。" +
            "\n\n" + generateActionGuidance();
    }

    // ============================================================
    //  复制结果
    // ============================================================
    function copyResult() {
        if (!finalCopyText) return;
        navigator.clipboard.writeText(finalCopyText).then(() => {
            alert('✨ 结果已复制，爱意永存 ✨');
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = finalCopyText;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            alert('✨ 结果已复制，爱意永存 ✨');
        });
    }

    // ============================================================
    //  继续占卜
    // ============================================================
    function continueReading() {
        selectedCards = [];
        drawnCount = 0;
        finalCopyText = '';

        placeholders.forEach(el => {
            el.classList.remove('flipped');
            el.innerHTML = '<div class="label">'+ (el.dataset.idx==='0'?'现状':el.dataset.idx==='1'?'深层':'建议') +'</div>';
        });

        questionInput.value = '';

        drawArea.style.display = 'none';
        resultArea.style.display = 'none';
        setupArea.style.display = 'block';

        deckBtn.disabled = false;
        deckBtn.textContent = '抽牌';
    }
</script>
</body>
</html>
